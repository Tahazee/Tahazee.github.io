<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&amp;display=swap');
      
      .brand-process {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 130px;
        fill: #1a4f7c;
        letter-spacing: -1.5px;
      }
      
      .brand-turk {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 130px;
        fill: #eb445a;
        letter-spacing: -1.5px;
      }
      
      .brand-tagline {
        font-family: 'Montserrat', 'Arial', sans-serif;
        font-weight: 800;
        font-size: 31px;
        fill: #1a4f7c;
        letter-spacing: 7.8px;
      }
    </style>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Main Wordmark -->
    <text x="80" y="142">
      <tspan class="brand-process">PROCESS</tspan><tspan class="brand-turk">TÜRK</tspan>
    </text>

    <!-- Registered Trademark (R) Symbol -->
    <g transform="translate(1005, 74)">
      <circle cx="0" cy="0" r="16.5" fill="none" stroke="#eb445a" stroke-width="4.2" />
      <text x="0" y="5.8" font-family="'Montserrat', sans-serif" font-weight="900" font-size="19" fill="#eb445a" text-anchor="middle">R</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="82" y="196" class="brand-tagline">TURNKEY INDUSTRIAL PLANT SOLUTIONS</text>
  </g>
</svg>
