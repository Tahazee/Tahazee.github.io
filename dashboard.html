<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Taha Zeeshan</title>
  <meta name="description" content="Personal analytics dashboard for Taha Zeeshan — AI/ML metrics, project activity, GitHub stats, and skill overview.">
  <meta name="author" content="Taha Zeeshan">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css?v=102">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='Inter' font-size='13' font-weight='800' fill='white'>TZ</text></svg>">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs) {
        for (var r of rs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(ks) {
        for (var k of ks) caches.delete(k);
      });
    }
  </script>
</head>
<body>

  <!-- ── TOPBAR ── -->
  <header id="topbar" role="banner">
    <div class="topbar-left">
      <div class="app-dots">
        <span class="app-dot"></span>
        <span class="app-dot"></span>
        <span class="app-dot"></span>
      </div>
      <div class="app-icon">TZ</div>
      <span class="topbar-app-name">Analytics Dashboard</span>
    </div>

    <div class="topbar-center">
      <!-- Back to portfolio -->
      <a class="topbar-btn" href="index.html" style="text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Portfolio
      </a>
      <button class="topbar-btn" id="btn-analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Analytics
      </button>
      <button class="topbar-btn active" id="btn-preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M22 12c-2.667 4.667-6 7-10 7s-7.333-2.333-10-7c2.667-4.667 6-7 10-7s7.333 2.333 10 7"/></svg>
        Live Site ↗
      </button>
    </div>

    <div class="topbar-right">
      <button class="topbar-cmd-btn" id="cmd-trigger" aria-label="Open search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
        <kbd>⌘K</kbd>
      </button>
      <div class="topbar-user">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Taha Zeeshan</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
  </header>

  <!-- ── DASHBOARD ── -->
  <div id="dashboard">
    <!-- LEFT: Profile Sidebar -->
    <aside id="profile-sidebar" role="complementary" aria-label="Profile"></aside>

    <!-- CENTER: Main Panels -->
    <main id="main-panels" role="main"></main>

    <!-- RIGHT: Projects Rail -->
    <aside id="projects-rail" role="complementary" aria-label="Projects"></aside>
  </div>

  <!-- ── MOBILE DASHBOARD BOTTOM TABS NAV ── -->
  <nav id="mobile-dash-nav" aria-label="Mobile Dashboard Navigation">
    <button class="dash-nav-tab active" data-tab="overview" aria-label="Dashboard Overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Overview</span>
    </button>
    <button class="dash-nav-tab" data-tab="projects" aria-label="View Projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      <span>Projects</span>
    </button>
    <button class="dash-nav-tab" data-tab="activity" aria-label="View Activity & Charts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Activity</span>
    </button>
    <button class="dash-nav-tab" data-tab="profile" aria-label="View Profile & Education">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </button>
  </nav>


  <!-- ── COMMAND PALETTE ── -->
  <div id="cmd-overlay" role="dialog" aria-modal="true" aria-label="Search">
    <div id="cmd-palette">
      <div class="cmd-input-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="cmd-input" type="text" placeholder="Search projects, skills, experience..." autocomplete="off" spellcheck="false" aria-label="Search">
        <span class="cmd-hint-badge">ESC</span>
      </div>
      <div class="cmd-results" id="cmd-results" role="listbox"></div>
      <div class="cmd-footer">
        <div class="cmd-footer-hint"><kbd class="cmd-key">↑↓</kbd> navigate</div>
        <div class="cmd-footer-hint"><kbd class="cmd-key">↵</kbd> open</div>
        <div class="cmd-footer-hint"><kbd class="cmd-key">Esc</kbd> close</div>
      </div>
    </div>
  </div>

  <!-- Scripts (v=102) -->
  <script src="assets/js/data.js?v=102"></script>
  <script src="assets/js/github.js?v=102"></script>
  <script src="assets/js/app.js?v=102"></script>


</body>
</html>
